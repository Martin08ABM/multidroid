<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="id.waydro.Multi.Container"/>
  </policy>
  <policy context="default">
    <allow send_destination="id.waydro.Multi.Container" send_interface="id.waydro.Multi.Manager1" send_type="method_call"/>
    <allow send_destination="id.waydro.Multi.Container" send_interface="org.freedesktop.DBus.Introspectable" send_type="method_call"/>
    <allow send_destination="id.waydro.Multi.Container" send_interface="org.freedesktop.DBus.Peer" send_type="method_call"/>
  </policy>
</busconfig>
